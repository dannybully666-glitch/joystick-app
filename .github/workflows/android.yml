name: Build Penguinz0 Player APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Fetch catalogue and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install latest yt-dlp nightly
        run: python -m pip install --upgrade --pre yt-dlp

      - name: Fetch Penguinz0 public video catalogue
        run: python scripts/fetch_catalogue.py

      - name: Verify generated catalogue is not empty
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          p = Path("app/src/main/assets/catalogue.js")
          text = p.read_text(encoding="utf-8")
          match = re.search(r"window\\.P0_CATALOGUE\\s*=\\s*(\\[.*\\])\\s*;", text, re.S)
          if not match:
              raise SystemExit("catalogue.js does not contain a P0_CATALOGUE array")
          rows = json.loads(match.group(1))
          print(f"Catalogue ready: {len(rows)} videos")
          if not rows:
              raise SystemExit("Refusing to build an APK with an empty catalogue")
          PY

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Penguinz0-Player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
