name: Build Penguinz0 Player APK
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python -m pip install --upgrade yt-dlp
      - name: Fetch full public catalogue
        run: python scripts/fetch_catalogue.py
      - name: Commit refreshed bundled catalogue
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/catalogue.js
          git diff --cached --quiet || git commit -m "Refresh Penguinz0 video catalogue"
          git push
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Penguinz0-Player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
