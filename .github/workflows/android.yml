name: Build Penguinz0 Player APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android.yml'

  pull_request:
    paths:
      - 'app/src/main/java/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Fetch catalogue, build semantic index and APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install catalogue and semantic-index dependencies
        run: |
          python -m pip install --upgrade --pre yt-dlp
          python -m pip install sentence-transformers

      - name: Fetch Penguinz0 public video catalogue
        run: python scripts/fetch_catalogue.py

      - name: Verify catalogue
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path("app/src/main/assets/catalogue.js")
          text = p.read_text(encoding="utf-8")
          prefix = "window.P0_CATALOGUE ="

          if not text.startswith(prefix):
              raise SystemExit("catalogue.js does not contain window.P0_CATALOGUE")

          rows = json.loads(text[len(prefix):].strip().removesuffix(";"))
          print(f"Catalogue ready: {len(rows)} videos")

          if not rows:
              raise SystemExit("Refusing to build with an empty catalogue")
          PY

      - name: Build one semantic embedding per video
        run: python scripts/build_semantic_index.py

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Penguinz0-Player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
