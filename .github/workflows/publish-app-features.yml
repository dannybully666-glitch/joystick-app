name: Publish app feature updates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: penguinz0-app-feature-publish
  cancel-in-progress: false

jobs:
  publish-app-features:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main app source
        uses: actions/checkout@v4
        with:
          ref: main
          path: app-source

      - name: Check out gh-pages publication branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-site
          fetch-depth: 0

      - name: Package and validate app feature bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          assets = Path("app-source/app/src/main/assets")
          required = [
              "index.html",
              "catalogue.js",
              "twitch-lava-spinner.png",
              "twitch-angelic-sigil.png",
          ]
          for name in required:
              path = assets / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Required app feature file is missing or empty: {path}")

          html = (assets / "index.html").read_text(encoding="utf-8")
          for marker in (
              "schedule-1-twitch-highlights-card-theme",
              "th-schedule-1-spinner-velocity-controller",
          ):
              if marker not in html:
                  raise SystemExit(f"Schedule 1 feature validation failed: missing {marker}")

          remote = Path("gh-pages-site/remote-app")
          remote.mkdir(parents=True, exist_ok=True)
          files = sorted(p for p in assets.rglob("*") if p.is_file())
          temporary = Path("app-feature-bundle.zip")
          with zipfile.ZipFile(temporary, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for item in files:
                  archive.write(item, item.relative_to(assets).as_posix())

          digest = hashlib.sha256(temporary.read_bytes()).hexdigest()
          archive_name = f"app-{digest}.zip"
          target = remote / archive_name
          target.write_bytes(temporary.read_bytes())

          manifest = {
              "schema": 1,
              "version": digest,
              "bundle_sha256": digest,
              "bundle_url": f"https://raw.githubusercontent.com/dannybully666-glitch/joystick-app/gh-pages/remote-app/{archive_name}",
              "min_native_version_code": 1,
              "source_commit": "${{ github.sha }}"
          }
          (remote / "manifest.json").write_text(
              json.dumps(manifest, separators=(",", ":")), encoding="utf-8"
          )

          # Verify the exact bytes that will be published and their ZIP integrity.
          if hashlib.sha256(target.read_bytes()).hexdigest() != digest:
              raise SystemExit("Published archive checksum self-check failed")
          with zipfile.ZipFile(target) as check:
              bad = check.testzip()
              if bad:
                  raise SystemExit(f"Published archive ZIP integrity failed: {bad}")
          print(f"Published bundle: {archive_name}")
          print(f"SHA-256: {digest}")
          print(f"Files: {len(files)}")
          print(f"Source commit: ${{ github.sha }}")
          PY

      - name: Commit app feature package without touching semantic data
        working-directory: gh-pages-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote-app/manifest.json remote-app/app-*.zip
          if git diff --cached --quiet; then
            echo "No app feature changes to publish."
            exit 0
          fi
          git commit -m "Publish app feature update"
          git push origin gh-pages
