/* Consolidated source block 1: base-style-1 */
:root{color-scheme:dark;--bg:#0f0f0f;--surface:#181818;--surface2:#272727;--text:#f1f1f1;--muted:#aaa;--line:#303030}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-width:0;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font:14px Roboto,Arial,system-ui,sans-serif}
html{scroll-behavior:smooth}
body{padding-bottom:76px}
button,input,select{font:inherit;color:inherit}button{border:0;cursor:pointer}
.topbar{height:58px;position:sticky;top:0;z-index:20;background:#0f0f0f;display:flex;align-items:center;gap:13px;padding:0 16px;border-bottom:1px solid #202020}
.logo{width:34px;height:34px;border-radius:50%;background:#e62117;display:grid;place-items:center;font-size:19px;font-weight:900;flex:none}
.brand{font-size:19px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}.brand span{font-size:10px;color:#aaa;vertical-align:top;margin-left:3px}
.searchwrap{margin-left:auto;display:flex;max-width:560px;width:100%;height:40px;min-width:0}
.searchwrap input{min-width:0;flex:1;background:#121212;border:1px solid #333;border-radius:22px 0 0 22px;padding:0 16px;outline:none}
.searchwrap input:focus{border-color:#3d75bd}.searchwrap button{width:54px;flex:none;background:#282828;border:1px solid #333;border-left:0;border-radius:0 22px 22px 0;font-size:18px}
.iconbtn{background:transparent;color:#eee;font-size:21px;width:38px;height:38px;border-radius:50%}
.chips{position:sticky;top:58px;z-index:15;background:#0f0f0f;display:flex;gap:9px;overflow-x:auto;padding:11px 16px;border-bottom:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border-radius:8px;background:#272727;padding:8px 13px;font-weight:600;font-size:13px}.chip.active{background:#f1f1f1;color:#111}
main{width:100%;max-width:1280px;margin:0 auto;padding:16px;min-width:0}
.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:8px 0 15px;gap:10px}.sectionhead h2{font-size:20px;margin:0;letter-spacing:-.3px}.subtle{color:var(--muted);font-size:12px}
.feed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 16px}
.video-card{min-width:0;cursor:pointer}.thumbwrap{position:relative;aspect-ratio:16/9;background:#202020;border-radius:13px;overflow:hidden}.thumb{width:100%;height:100%;object-fit:cover;display:block}
.video-info{display:flex;gap:11px;padding-top:11px}.avatar{width:36px;height:36px;border-radius:50%;background:#e62117;display:grid;place-items:center;flex:none;font-weight:900}
.video-copy{min-width:0;flex:1}.video-title{font-size:15px;font-weight:650;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-meta{font-size:12px;color:var(--muted);line-height:1.55;margin-top:5px}.more{background:transparent;color:#aaa;font-size:19px;padding:0 4px;align-self:flex-start}
#playerView{display:none;margin:0 0 24px;width:100%;max-width:none;min-width:0}
.playerframe{position:relative;width:100%;aspect-ratio:16/9;background:transparent;border:0;border-radius:0;overflow:hidden;box-shadow:none;outline:0}
.playerframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}
.playerheading{font-size:20px;font-weight:750;line-height:1.35;margin:14px 2px 7px}
.playeractions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
.pillbtn{border-radius:20px;background:#272727;padding:10px 15px;font-weight:600}.pillbtn.primary{background:#f1f1f1;color:#111}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 15px}.toolbar select{background:#272727;border:0;border-radius:8px;padding:9px 12px}
.status{color:#aaa;font-size:12px;margin:10px 0}.empty{grid-column:1/-1;text-align:center;color:#aaa;padding:50px 15px;background:#181818;border-radius:14px}
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:64px;padding-bottom:env(safe-area-inset-bottom);background:#0f0f0f;border-top:1px solid #292929;display:flex;justify-content:space-around;z-index:30}

.navitem b{font-size:20px;font-weight:400}.navitem.active{color:#fff}
.page{display:none}.page.active{display:block}
.settingsbox{background:#181818;border-radius:14px;padding:16px;max-width:650px}.settingsbox p{color:#aaa;line-height:1.5}
.settingsbox button{background:#303030;padding:10px 14px;border-radius:9px}.settingsbox input[type=file]{display:none}
@media(max-width:900px){.feed{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}main{padding:13px}}
@media(max-width:560px){
 .topbar{padding:0 11px;gap:9px}.brand{font-size:17px}.brand span{display:none}.searchwrap{max-width:none}

 /* Full-bleed watch player: ignore the feed's side gutters. */
 #playerView{width:calc(100% + 26px);margin-left:-13px;margin-right:-13px}

}
@media(orientation:landscape){

 .playerheading,.playeractions,#playingMeta{margin-left:16px;margin-right:16px}
}

/* Shorts-style vertical snap feed: one full-height card per swipe */
#shortsPage{width:100%;max-width:100%;min-width:0}
#shortsPage .sectionhead{
 position:relative;z-index:8;padding:10px 0 12px;
 background:transparent;display:flex;align-items:center;justify-content:space-between;
}
#shortsGrid{
 display:block;width:100%;
 height:calc(100vh - 245px);
 height:calc(100dvh - 245px);
 min-height:420px;max-height:900px;
 overflow-y:auto;overflow-x:hidden;
 overscroll-behavior-y:contain;
 scroll-snap-type:y mandatory;
 scroll-behavior:smooth;
 -webkit-overflow-scrolling:touch;
 scrollbar-width:none;
}
#shortsGrid::-webkit-scrollbar{display:none}
.short-card{
 position:relative;display:block;
 width:min(100%,430px);height:100%;
 min-height:420px;max-height:900px;
 margin:0 auto 12px;
 overflow:hidden;background:#080a0d;
 border:0;border-radius:8px;cursor:pointer;
 scroll-snap-align:start;scroll-snap-stop:always;
}
.short-card .short-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.short-card .short-iframe{
 position:absolute;left:0;top:50%;width:100%;height:31.640625%;
 border:0;display:block;background:#000;
 transform:translateY(-50%) scaleY(3.1604938272);
 transform-origin:center center;z-index:5;
}
.short-card .short-shade{position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.82));pointer-events:none}
.short-card .short-title{position:absolute;left:12px;right:12px;bottom:14px;color:white;font-size:14px;font-weight:700;line-height:1.35;text-shadow:0 1px 4px #000;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;pointer-events:none}
.short-card .short-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-size:23px;border:1px solid rgba(255,255,255,.45);pointer-events:none}
.short-card.is-playing .short-thumb,.short-card.is-playing .short-play,.short-card.is-playing .short-shade,.short-card.is-playing .short-title{display:none!important}
#shortsMore{display:block;margin:14px auto 24px}

 #shortsGrid{width:100%;height:calc(100vh - 245px);height:calc(100dvh - 245px);min-height:390px}

}

 .short-card{width:min(100%,560px)}
}

/* Full-screen Shorts presentation: hide the regular app chrome and let each

body.shorts-mode{overflow:hidden;padding-bottom:0}
body.shorts-mode>.topbar,
body.shorts-mode>#chips{display:none!important}
body.shorts-mode>main{padding:0!important;margin:0!important;width:100%!important;max-width:none!important}
body.shorts-mode #shortsPage{
 display:flex!important;flex-direction:column;
 position:fixed;inset:0;z-index:25;
 width:100%;height:100%;max-width:none;min-width:0;
 margin:0;padding:0;background:#000;overflow:hidden;
}
body.shorts-mode #shortsPage .sectionhead{display:none!important}
body.shorts-mode #shortsGrid{
 display:block;flex:1 1 auto;
 width:100%;height:100%;min-height:0;max-height:none;
 margin:0;padding:0;overflow-y:auto;overflow-x:hidden;
 scroll-snap-type:y mandatory;overscroll-behavior-y:contain;
 -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
body.shorts-mode #shortsGrid::-webkit-scrollbar{display:none}
body.shorts-mode .short-card{
 width:100%;height:100%;min-height:0;max-height:none;

}

body.shorts-mode .navitem.active{color:#fff!important}

/* Correct the Shorts embed viewport.
   Do not vertically scale a short iframe: YouTube lays out its own player UI
   inside the iframe viewport, which caused the black band and distorted controls. */
.short-card .short-iframe,
body.shorts-mode .short-card .short-iframe {
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  min-width:0!important;
  min-height:0!important;
  border:0!important;
  margin:0!important;
  padding:0!important;
  display:block!important;
  background:#000!important;
  transform:none!important;
  transform-origin:initial!important;
  z-index:5!important;
}

/* GitHub-published data sync status in Settings */
.github-sync-panel{margin:14px 0 16px;padding:15px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.035)}
.github-sync-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.github-sync-title{font-weight:750}
.github-sync-refresh{padding:9px 12px;border:1px solid rgba(225,236,250,.18);border-radius:6px;background:rgba(255,255,255,.085);color:var(--text)}
.github-sync-refresh:disabled{opacity:.5;cursor:default}
.github-sync-state{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;color:var(--muted);line-height:1.4}
.github-sync-dot{width:8px;height:8px;border-radius:50%;background:#8793a2;flex:none}
.github-sync-panel.checking .github-sync-dot{background:#e9b44c;animation:githubSyncPulse 1.1s ease-in-out infinite}
.github-sync-panel.success .github-sync-dot{background:#45c486}
.github-sync-panel.error .github-sync-dot{background:#e66b75}
.github-sync-detail{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.5}
@keyframes githubSyncPulse{50%{opacity:.35;transform:scale(.8)}}
@media(prefers-reduced-motion:reduce){.github-sync-dot{animation:none!important}}

.indefinite-switch{display:inline-flex;align-items:center;gap:9px;min-height:42px;padding:0 4px;color:var(--text);font-size:13px;font-weight:650;cursor:pointer;user-select:none}

.switch-track{width:42px;height:24px;border-radius:99px;background:#747b86;display:inline-flex;align-items:center;padding:3px;transition:background .18s ease;flex:none}
.switch-thumb{width:18px;height:18px;border-radius:50%;background:white;box-shadow:0 1px 3px #0005;transform:translateX(0);transition:transform .18s ease}
.indefinite-switch input:checked+.switch-track{background:#23865d}

.indefinite-switch input:focus-visible+.switch-track{outline:3px solid rgba(85,155,235,.55);outline-offset:3px}
